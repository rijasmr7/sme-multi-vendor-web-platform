version: '3.8'

services:
  gateway:
    build: ./gateway
    container_name: sme_gateway
    ports:
      - "5000:5000"
    volumes:
      - ./gateway:/app
      - /app/node_modules
    environment:
      # Inject Docker internal DNS locations
      - PRODUCT_SERVICE_URL=http://product:5001
      - AI_SERVICE_URL=http://ai:5002
      - ANALYTICS_SERVICE_URL=http://analytics:5003
      - USER_SERVICE_URL=http://user:5004
      - ORDER_SERVICE_URL=http://order:5005
      - RECOMMENDER_SERVICE_URL=http://recommender:8008
      - HYBRID_RECOMMENDER_URL=http://recommender:8008
      - WEBAR_SERVICE_URL=http://webar:5006
      - LOCATION_SERVICE_URL=http://location:5007
    depends_on:
      - product
      - ai
      - analytics
      - user
      - order
      - recommender
      - webar
      - location

  product:
    build: ./services/product-service
    container_name: sme_product_service
    ports:
      - "5001:5001"
    env_file:
      - ./services/product-service/.env
    volumes:
      - ./services/product-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  user:
    build: ./services/user-service
    container_name: sme_user_service
    ports:
      - "5004:5004"
    env_file:
      - ./services/user-service/.env
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  ai:
    build: ./services/ai-service
    container_name: sme_ai_service
    ports:
      - "5002:5002"
    env_file:
      - ./services/ai-service/.env
    volumes:
      - ./services/ai-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  analytics:
    build: ./services/analytics-service
    container_name: sme_analytics_service
    ports:
      - "5003:5003"
    env_file:
      - ./services/analytics-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./services/analytics-service:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  order:
    build: ./services/order-service
    container_name: sme_order_service
    ports:
      - "5005:5005"
    env_file:
      - ./services/order-service/.env
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  recommender:
    build: ./services/ai-recommender-service
    container_name: sme_recommender_service
    ports:
      - "8008:8008"
    env_file:
      - ./services/ai-recommender-service/.env
    environment:
      - PRODUCT_SERVICE_URL=http://product:5001
      - ORDER_SERVICE_URL=http://order:5005
      - LOCATION_SERVICE_URL=http://location:5007
      - ANALYTICS_SERVICE_URL=http://analytics:5003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./services/ai-recommender-service:/app
    depends_on:
      - postgres
      - product
      - order
      - location
      - analytics
      - redis

  webar:
    build: ./services/webar-service
    container_name: sme_webar_service
    ports:
      - "5006:5006"
    env_file:
      - ./services/webar-service/.env
    volumes:
      - ./services/webar-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  location:
    build: ./services/location-service
    container_name: sme_location_service
    ports:
      - "5007:5007"
    env_file:
      - ./services/location-service/.env
    volumes:
      - ./services/location-service:/app
      - /app/node_modules
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
      network: host
    container_name: sme_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  customer-frontend:
    build: ./customer-frontend
    container_name: sme_customer_frontend
    ports:
      - "5174:5174"
    volumes:
      - ./customer-frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  admin-frontend:
    build: ./admin-frontend
    container_name: sme_admin_frontend
    ports:
      - "5175:5175"
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    depends_on:
      - gateway


  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: sme_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: sme_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: sme_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
