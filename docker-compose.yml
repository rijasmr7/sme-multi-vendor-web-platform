version: '3.8'

services:
  gateway:
    build: ./gateway
    container_name: sme_gateway
    ports:
      - "5000:5000"
    environment:
      # Inject Docker internal DNS locations
      - PRODUCT_SERVICE_URL=http://product:5001
      - AI_SERVICE_URL=http://ai:5002
      - ANALYTICS_SERVICE_URL=http://analytics:5003
      - USER_SERVICE_URL=http://user:5004
      - ORDER_SERVICE_URL=http://order:5005
    depends_on:
      - product
      - ai
      - analytics
      - user
      - order

  product:
    build: ./services/product-service
    container_name: sme_product_service
    ports:
      - "5001:5001"
    env_file:
      - ./services/product-service/.env
    volumes:
      - ./services/product-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  user:
    build: ./services/user-service
    container_name: sme_user_service
    ports:
      - "5004:5004"
    env_file:
      - ./services/user-service/.env
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  ai:
    build: ./services/ai-service
    container_name: sme_ai_service
    ports:
      - "5002:5002"
    env_file:
      - ./services/ai-service/.env
    volumes:
      - ./services/ai-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  analytics:
    build: ./services/analytics-service
    container_name: sme_analytics_service
    ports:
      - "5003:5003"
    env_file:
      - ./services/analytics-service/.env
    volumes:
      - ./services/analytics-service:/app
      - /app/node_modules
    depends_on:
      - postgres

  order:
    build: ./services/order-service
    container_name: sme_order_service
    ports:
      - "5005:5005"
    env_file:
      - ./services/order-service/.env
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
    depends_on:
      - postgres


  frontend:
    build: ./frontend
    container_name: sme_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  customer-frontend:
    build: ./customer-frontend
    container_name: sme_customer_frontend
    ports:
      - "5174:5174"
    volumes:
      - ./customer-frontend:/app
      - /app/node_modules
    depends_on:
      - gateway


  postgres:
    image: postgres:15-alpine
    container_name: sme_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: sme_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
